# Optional BASS accelerator (V3.1 §10.4–§10.6, §12.6). Train only after profiling shows Laplace/defensive IS is too slow.
[tasks]
seconds_per_task_estimate = 2.0e-3
[tasks.options]
frame_dt_s = 1.0
max_frames = 8
width_m = 0.04
length_m = 0.1

[train]
precision = "fp32"
steps = 10000                # cap 10000-25000 (§12.6)
batch_size = 256
lr = 1.0e-3
clip_norm = 1.0
validation_fraction = 0.1
seed = 0
seconds_per_step_estimate = 0.08   # FP32 CPU estimate (CUDA: build with --features cuda)

[benchmark]
particles = 256
epsilon = 0.1
