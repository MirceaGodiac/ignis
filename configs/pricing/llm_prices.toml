# LLM price list for IGNIS cost metrics (M5). Versioned: change `version` with every edit, and
# never edit a published version in place (metrics and traces name the list as `<name>@<version>`).
#
# Prices are USD per million tokens. A model that is not listed here, or usage of a token class
# whose price is absent (e.g. cache writes without `cache_write_per_mtok`), is reported as
# `unpriced`, never as zero. Matching is exact on `id` or one of `aliases` (the id the runtime
# reports).
#
# Token classes: `input_per_mtok` prices input that was neither read from nor written to the
# prompt cache; `cached_input_per_mtok` prices cache reads; `cache_write_per_mtok` prices cache
# writes; `output_per_mtok` prices output (reasoning included).
#
# Override with `ignis serve --price-list <file>` / `IGNIS_PRICE_LIST`; this file is also built
# into the binary as the default.

name = "ignis-llm-prices"
version = "2026-11-15"
currency = "USD"
source = "Anthropic first-party API list prices as cached by the Claude API reference (input, output, cache read); cache writes at Anthropic's 1.25x input rate for the 5-minute cache. OpenAI/Codex models are not listed (no verified price): their usage is unpriced."

[[models]]
id = "claude-opus-5-5"
input_per_mtok = 4.0
cached_input_per_mtok = 0.20
cache_write_per_mtok = 5.0
output_per_mtok = 20.0

[[models]]
id = "claude-sonnet-5-5"
input_per_mtok = 2.0
cached_input_per_mtok = 0.10
cache_write_per_mtok = 2.5
output_per_mtok = 10.0

[[models]]
id = "claude-fable-5-2"
input_per_mtok = 8.0
cached_input_per_mtok = 0.20
cache_write_per_mtok = 10.0
output_per_mtok = 40.0

# Claude Haiku 5.5 is not listed: its price depends on the prompt length of each request (above
# 100K tokens it doubles), which per-turn usage totals do not show.
