# IGNIS corpus seeds. The corpus is selective: a work is listed because it
# brings results, a method, a calibration, a definition or a contradiction; a rejected work keeps its
# reason. The status of each entry (discovered | metadata_only | downloaded | parsed | indexed | rejected |
# restricted) is computed by `ignis evidence corpus status` from the bytes and the catalog, never typed here.
#
# collection: science_results | experimental_methods | measurements | ignis_methods
# outcome_free: a reviewed declaration (with its evidence) that no passage can reveal how a run ended,
# e.g. a document written before the flights. Without it, the section heuristics and the lockbox decide.
# Bytes: `ntrs_id` -> data/raw/evidence/ntrs/NTRS-<id>.pdf (+ citation JSON), fetched by
# `ignis evidence corpus fetch --execute`; `psi_file` -> data/raw/samples/<investigation>/<file>, fetched by
# the PSI connector (`ignis sources ...`) and identified by data/manifests/<investigation>.jsonl.

