[project]
name = "ignis-sam2-sidecar"
version = "0.2.0"
description = "IGNIS SAM2.1 causal tracking sidecar (driven by `ignis vision contours --method sam2`)"
requires-python = ">=3.11,<3.14"
# Only SAM2 and what it strictly needs (SAM2 itself pulls torch, numpy and pillow).
dependencies = [
  "sam2 @ git+https://github.com/facebookresearch/sam2",
  "torch>=2.5",
  "numpy>=2.1",
  "pillow>=10",
]

[tool.uv]
package = false
