[package]
name = "ignis-evidence"
description = "IGNIS scientific retrieval: PDF chunks with page/char locators, SQLite FTS5 catalog, Qwen3 dense + rerank via the DeepInfra API, RRF, leak firewall"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `pdf` (MuPDF) is needed only by `ignis evidence ingest`. Building mupdf-sys on Windows needs LLVM
# (CLANG_PATH) and a VS `vcvars64` environment, so the `ignis` binary builds without it by default:
#   cargo build -p ignis-cli --features pdf
default = []
pdf = ["dep:mupdf"]

[dependencies]
ignis-core = { path = "../ignis-core" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
toml.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
regex = "1"
unicode-normalization = "0.1"
# MuPDF: the same engine PyMuPDF wraps, so blocks/char spans keep the catalog's coordinate system.
# base14-fonts: substitutes for non-embedded fonts (Arial -> Helvetica); without them MuPDF drops that text.
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"], optional = true }
# blocking HTTPS client for the DeepInfra embeddings/rerank endpoints (same crate as ignis-data)
ureq = "3"

[dev-dependencies]
