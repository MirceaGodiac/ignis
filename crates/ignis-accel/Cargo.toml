[package]
name = "ignis-accel"
description = "Optional inference accelerators: prefix encoder + rational-quadratic spline coupling flows, defensive-mixture reweighting, proposal tasks"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Train on an NVIDIA GPU (needs the CUDA toolkit); CPU otherwise.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
ignis-core = { path = "../ignis-core" }
ignis-science = { path = "../ignis-science" }
ignis-acme = { path = "../ignis-acme" }
ignis-bass = { path = "../ignis-bass" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
clap.workspace = true
toml.workspace = true
rand = { version = "0.10", features = ["chacha"] }
rand_distr = "0.6"
candle-core = "0.11"
candle-nn = "0.11"
