# Merge gates from docs/implementation/INTEGRATION.md. Offline only: live tests (real Codex, model
# turns, container runner) are #[ignore] and need credentials or engines CI does not have.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The workspace's debug build with full debug info does not fit the runner's disk (the linker
  # died with SIGBUS); CI needs no debugger symbols.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-nodebug-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-nodebug-${{ runner.os }}-
      - name: fmt
        run: cargo fmt --all -- --check
      - name: check
        run: cargo check --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked --no-fail-fast
      - name: schema drift
        run: |
          cargo run -q -p ignis-cli --locked -- schemas export
          git diff --exit-code -- schemas/ || { echo "::error::schemas/ is stale: run 'cargo run -p ignis-cli -- schemas export' and commit"; exit 1; }
          test -z "$(git status --porcelain -- schemas/)" || { git status -- schemas/; echo "::error::untracked schemas"; exit 1; }

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: generated.ts matches schemas/
        run: npm --prefix web run check:types
      - run: npm --prefix web run build

  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: infra/worker/package-lock.json
      - run: npm ci --prefix infra/worker
      - run: npm --prefix infra/worker run typecheck
      - run: npm --prefix infra/worker test

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck infra/scripts/*.sh infra/server/entrypoint.sh tools/runner/build.sh
      - name: compose config
        run: |
          d=$(mktemp -d)
          cp infra/deploy/ignis.env.example "$d/ignis.env"
          echo "TUNNEL_TOKEN=x" > "$d/cloudflared.env"
          mkdir "$d/secrets" && touch "$d/secrets/CODEX_API_KEY" "$d/secrets/IGNIS_R2_SECRET_ACCESS_KEY"
          IGNIS_IMAGE=ignis-server@sha256:0000 CLOUDFLARED_IMAGE=cloudflare/cloudflared@sha256:0000 DOCKER_GID=999           IGNIS_ENV_FILE="$d/ignis.env" CLOUDFLARED_ENV_FILE="$d/cloudflared.env" IGNIS_SECRETS_DIR="$d/secrets"             docker compose -f infra/deploy/compose.yaml config -q
          IGNIS_IMAGE=ignis-server@sha256:0000 CLOUDFLARED_IMAGE=cloudflare/cloudflared@sha256:0000 DOCKER_GID=999           IGNIS_ENV_FILE="$d/ignis.env" CLOUDFLARED_ENV_FILE="$d/cloudflared.env" IGNIS_SECRETS_DIR="$d/secrets"             CADDY_IMAGE=caddy@sha256:0000 IGNIS_API_HOSTNAME=api.example.org             docker compose -f infra/deploy/compose.yaml -f infra/deploy/compose.google.yaml config -q
      - name: systemd units
        run: |
          # Only the unit syntax; the referenced paths exist on the deployed host, not here.
          for u in infra/deploy/systemd/*.service infra/deploy/systemd/*.timer; do
            systemd-analyze verify --man=no "$u" 2>&1 | grep -viE "not executable|No such file|Failed to prepare|is not a directory|Unit .* not found|docker.service" | tee /tmp/sa.txt
            if grep -qiE "unknown|invalid|failed to parse" /tmp/sa.txt; then exit 1; fi
          done
