# Merge gates from docs/implementation/INTEGRATION.md. Offline only: live tests (real Codex, model
# turns, container runner) are #[ignore] and need credentials or engines CI does not have.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: fmt
        run: cargo fmt --all -- --check
      - name: check
        run: cargo check --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --locked --no-fail-fast
      - name: schema drift
        run: |
          cargo run -q -p ignis-cli --locked -- schemas export
          git diff --exit-code -- schemas/ || { echo "::error::schemas/ is stale: run 'cargo run -p ignis-cli -- schemas export' and commit"; exit 1; }
          test -z "$(git status --porcelain -- schemas/)" || { git status -- schemas/; echo "::error::untracked schemas"; exit 1; }

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: generated.ts matches schemas/
        run: npm --prefix web run check:types
      - run: npm --prefix web run build

  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: infra/worker/package-lock.json
      - run: npm ci --prefix infra/worker
      - run: npm --prefix infra/worker run typecheck
      - run: npm --prefix infra/worker test

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck infra/scripts/*.sh tools/runner/build.sh
      - name: compose config
        run: |
          cp infra/deploy/ignis.env.example /tmp/ignis.env
          IGNIS_ENV_FILE=/tmp/ignis.env docker compose -f infra/deploy/compose.yaml config -q
      - name: systemd units
        run: systemd-analyze verify --man=no infra/deploy/systemd/*.service || true
